name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP and Fix Project Files
        shell: bash
        run: |
          unzip -o FamilyFinanceTracker_fixed.zip -d project/
          cd project/FamilyFinanceTracker_fixed
          printf 'pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url \"https://jitpack.io\" }
    }
}
rootProject.name = \"FamilyFinanceTracker_fixed\"
include \":app\"
' > settings.gradle
          printf 'plugins {
    id \"com.android.application\" version \"8.2.0\" apply false
    id \"org.jetbrains.kotlin.android\" version \"1.9.20\" apply false
}
' > build.gradle
          mkdir -p gradle/wrapper
          printf 'distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
' > gradle/wrapper/gradle-wrapper.properties
          if [ -f "Gradle.properties" ] && [ ! -f "gradle.properties" ]; then cp Gradle.properties gradle.properties; fi
          echo "=== settings.gradle ===" && cat settings.gradle
          echo "=== build.gradle ===" && cat build.gradle

      - name: Generate Gradle Wrapper and Build
        shell: bash
        run: |
          cd project/FamilyFinanceTracker_fixed
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: project/FamilyFinanceTracker_fixed/app/build/outputs/apk/debug/*.apk
          
