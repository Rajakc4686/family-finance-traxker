name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract ZIP
        run: |
          if [ -f *.zip ]; then
            unzip -o *.zip -d project/
          fi

      - name: Find and Build
        run: |
          echo "Searching for gradlew..."
          find . -name "gradlew" -type f
          
          PROJECT_DIR=$(find . -name "gradlew" -type f -exec dirname {} \; | head -1)
          
          if [ -z "$PROJECT_DIR" ]; then
            echo "Error: gradlew not found!"
            echo "Directory structure:"
            find . -type f | head -50
            exit 1
          fi
          
          echo "Project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        shell: /usr/bin/bash -e {0}
        env:
          JAVA_HOME: /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17.0.19-10/x64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: '**/app/build/outputs/apk/debug/*.apk'
          
