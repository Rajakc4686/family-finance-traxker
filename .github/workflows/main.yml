name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: List ZIP contents
        run: |
          echo "=== Files in repo ==="
          ls -la
          echo ""
          echo "=== ZIP contents (first 100 files) ==="
          unzip -l FamilyFinanceTracker_fixed.zip | head -100
          echo ""
          echo "=== Extracting ==="
          unzip FamilyFinanceTracker_fixed.zip -d project
          echo ""
          echo "=== Top level after extract ==="
          ls -la project/
          echo ""
          echo "=== All gradle files ==="
          find project/ -name "*.gradle*" | sort
          echo ""
          echo "=== All .kt files ==="
          find project/ -name "*.kt" | head -20
          echo ""
          echo "=== All directories ==="
          find project/ -type d | sort | head -50
          
