name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show app build.gradle
        run: |
          unzip FamilyFinanceTracker_fixed.zip -d project
          cd project/FamilyFinanceTracker_fixed
          echo "=== app/build.gradle ==="
          cat app/build.gradle
          echo ""
          echo "=== gradle.properties ==="
          cat gradle.properties 2>/dev/null || echo "MISSING"
          echo ""
          echo "=== local.properties ==="
          cat local.properties 2>/dev/null || echo "MISSING"
          
