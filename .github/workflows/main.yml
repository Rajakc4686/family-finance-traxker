name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP and Build
        run: |
          unzip FamilyFinanceTracker_fixed.zip -d project
          cd project/FamilyFinanceTracker_fixed
          
          echo "=== settings.gradle ==="
          cat settings.gradle || echo "empty"
          
          echo "=== Generating Gradle Wrapper ==="
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          
          echo "=== Building APK ==="
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: project/FamilyFinanceTracker_fixed/app/build/outputs/apk/debug/*.apk
          
