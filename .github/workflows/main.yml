name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          unzip FamilyFinanceTracker_fixed.zip -d project
          cd project/FamilyFinanceTracker_fixed
          
          # Fix settings.gradle if empty
          if [ ! -s settings.gradle ]; then
            echo 'pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "FamilyFinanceTracker"
            include ":app"' > settings.gradle
          fi
          
          # Create root build.gradle for plugins DSL
          echo 'plugins {
              id "com.android.application" version "8.1.4" apply false
              id "org.jetbrains.kotlin.android" version "1.9.0" apply false
          }' > build.gradle
          
          # Create gradle.properties
          echo 'android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          android.nonTransitiveRClass=true' > gradle.properties
          
          # Use existing wrapper or create one
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi
          
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: project/FamilyFinanceTracker_fixed/app/build/outputs/apk/debug/*.apk
          
